<text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">สรุปข่าว FTA จากทั่วโลก 5 หัวข้อ</text>
<text x="50" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">สรุปเป็นภาษาไทย&quot;</text>


  <!-- Bottom bar -->
  <rect x="0" y="560" width="640" height="80" fill="rgba(0,0,0,0.2)"/>

  <!-- Difficulty -->
  <text x="40" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">ระดับความยาก:</text>
  <text x="40" y="612" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFA000" font-weight="bold">ขั้นสูง</text>
  <circle cx="415" cy="530" r="8" fill="#FFA000"/><circle cx="443" cy="530" r="8" fill="#FFA000"/><circle cx="471" cy="530" r="8" fill="#FFA000"/><circle cx="499" cy="530" r="8" fill="#FFA000"/><circle cx="527" cy="530" r="8" fill="#FFA000"/>

  <!-- Branding -->
  <text x="610" y="590" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="end">Mastering Google AI Ecosystem</text>
  <text x="610" y="608" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">กรมเจรจาการค้าระหว่างประเทศ</text>
