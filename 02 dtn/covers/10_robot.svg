  <circle cx="520" cy="100" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="560" cy="60" r="120" fill="rgba(255,255,255,0.04)"/>
  <circle cx="80" cy="560" r="140" fill="rgba(255,255,255,0.03)"/>

  <!-- Large icon background -->
  <g transform="translate(465,185) scale(3.5)" fill="#FFFFFF" opacity="0.15">
      <path d="M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-1-4c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z"/>
    </g>

  <!-- Top bar: Section label -->
  <rect x="30" y="24" width="354" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="42" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">ส่วนที่ 4: ค้นคว้า &amp; อัตโนมัติ</text>

  <!-- Number badge -->
  <circle cx="80" cy="150" r="50" fill="rgba(255,255,255,0.15)" filter="url(#shadow10)"/>
