<text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">ในกลุ่มอาเซียนอีก 5 ปีข้างหน้า</text>
<text x="50" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">พร้อมอ้างอิงแหล่งที่มา&quot;</text>


