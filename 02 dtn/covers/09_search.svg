  <circle cx="415" cy="530" r="8" fill="#FFA000"/><circle cx="443" cy="530" r="8" fill="#FFA000"/><circle cx="471" cy="530" r="8" fill="#FFA000"/><circle cx="499" cy="530" r="8" fill="#FFA000"/><circle cx="527" cy="530" r="8" fill="rgba(255,255,255,0.25)"/>

