<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="shadow6">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="640" fill="url(#bg6)" rx="0"/>

  <!-- Decorative circles -->
  <circle cx="520" cy="100" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="560" cy="60" r="120" fill="rgba(255,255,255,0.04)"/>
  <circle cx="80" cy="560" r="140" fill="rgba(255,255,255,0.03)"/>

  <!-- Large icon background -->
  <g transform="translate(465,185) scale(3.5)" fill="#FFFFFF" opacity="0.15">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      <text x="12" y="13.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF" stroke="none" opacity="0.3">1→2→3</text>
    </g>

  <!-- Top bar: Section label -->
  <rect x="30" y="24" width="299" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="42" y="44" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">ส่วนที่ 2: ทำงานกับข้อมูล</text>

  <!-- Number badge -->
  <circle cx="80" cy="150" r="50" fill="rgba(255,255,255,0.15)" filter="url(#shadow6)"/>
  <circle cx="80" cy="150" r="42" fill="rgba(255,255,255,0.2)"/>
  <text x="80" y="162" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>

  <!-- Title Thai -->
  <text x="145" y="140" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#FFFFFF" font-weight="bold">Chain of Thought</text>
  <!-- Subtitle Thai -->
  <text x="145" y="172" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)">คิดทีละสเต็ป</text>

  <!-- Divider -->
  <line x1="40" y1="210" x2="600" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- English subtitle -->
  <text x="40" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)" font-style="italic">Step-by-Step Reasoning</text>

  <!-- Content card: เทคนิค -->
  <rect x="30" y="270" width="580" height="110" rx="16" fill="url(#cardGrad6)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="50" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFA000" font-weight="bold">เทคนิค | TECHNIQUE</text>
  <text x="50" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start">สั่งให้ AI คิดวิเคราะห์เรียงลำดับ</text>
<text x="50" y="346" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start">ทีละขั้นตอน เพื่อความแม่นยำสูงสุด</text>


  <!-- Content card: ตัวอย่าง DTN -->
  <rect x="30" y="400" width="580" height="130" rx="16" fill="rgba(0,0,0,0.15)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="50" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFA000" font-weight="bold">ตัวอย่าง DTN | EXAMPLE</text>
  <text x="50" y="452" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">&quot;เจรจาการค้ากับแคนาดา ช่วยคิดทีละขั้น:</text>
<text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">1. วิเคราะห์จุดแข็งไทย</text>
<text x="50" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">2. จุดอ่อนแคนาดา</text>
<text x="50" y="518" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" text-anchor="start">3. วางกลยุทธ์ต่อรอง&quot;</text>


  <!-- Bottom bar -->
  <rect x="0" y="560" width="640" height="80" fill="rgba(0,0,0,0.2)"/>

  <!-- Difficulty -->
  <text x="40" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">ระดับความยาก:</text>
  <text x="40" y="612" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFA000" font-weight="bold">ปานกลาง</text>
  <circle cx="415" cy="530" r="8" fill="#FFA000"/><circle cx="443" cy="530" r="8" fill="#FFA000"/><circle cx="471" cy="530" r="8" fill="#FFA000"/><circle cx="499" cy="530" r="8" fill="rgba(255,255,255,0.25)"/><circle cx="527" cy="530" r="8" fill="rgba(255,255,255,0.25)"/>

  <!-- Branding -->
  <text x="610" y="590" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="end">Mastering Google AI Ecosystem</text>
  <text x="610" y="608" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">กรมเจรจาการค้าระหว่างประเทศ</text>
</svg>